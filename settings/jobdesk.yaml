# jobdesk build configuration
# Section list + templates. Content is resolved from SQLite (catalog + composition).

sections:
  - name: "header"
    enabled: true
    template: "themes/classic/sections/header.jinja.tex"

  - name: "objective"
    enabled: true
    template: "themes/classic/sections/objective.jinja.tex"

  - name: "education"
    enabled: true
    template: "themes/classic/sections/education.jinja.tex"

  - name: "experience"
    enabled: true
    template: "themes/classic/sections/experience.jinja.tex"

  - name: "projects"
    enabled: true
    template: "themes/classic/sections/projects.jinja.tex"

  - name: "certifications"
    enabled: true
    template: "themes/classic/sections/certifications.jinja.tex"

  - name: "awards"
    enabled: true
    template: "themes/classic/sections/awards.jinja.tex"

  - name: "toolbelt"
    enabled: true
    template: "themes/classic/sections/toolbelt.jinja.tex"

output:
  directory: "output"
  filename: "resume.tex"

preamble: "themes/classic/preamble.tex"
