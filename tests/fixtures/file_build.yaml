# File-based build for tests: repo content/ + classic theme (no SQLite).
sections:
  - name: "header"
    enabled: true
    content: "content/header.yaml"
    template: "themes/classic/sections/header.jinja.tex"

  - name: "objective"
    enabled: true
    content: "content/objective.yaml"
    template: "themes/classic/sections/objective.jinja.tex"

  - name: "education"
    enabled: true
    content: "content/education.yaml"
    template: "themes/classic/sections/education.jinja.tex"

  - name: "experience"
    enabled: true
    content: "content/experience.yaml"
    template: "themes/classic/sections/experience.jinja.tex"

  - name: "projects"
    enabled: true
    content: "content/projects.yaml"
    template: "themes/classic/sections/projects.jinja.tex"

  - name: "skills"
    enabled: true
    content: "content/skills.yaml"
    template: "themes/classic/sections/skills.jinja.tex"

output:
  directory: "output"
  filename: "resume.tex"

preamble: "themes/classic/preamble.tex"
