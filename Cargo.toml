[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/store",
    "crates/render_tex",
    "crates/render_pdf",
    "crates/jobdesk",
    "crates/server",
    "crates/resolve",
    "crates/similarity",
    "crates/theme",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
minijinja = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

domain = { path = "crates/domain" }
render_pdf = { path = "crates/render_pdf" }
render_tex = { path = "crates/render_tex" }
resolve = { path = "crates/resolve" }
thiserror = "2"
server = { path = "crates/server" }
similarity = { path = "crates/similarity" }
store = { path = "crates/store" }
theme = { path = "crates/theme" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
